<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101a28" media="(prefers-color-scheme: dark)" />

    <!-- scripts/prerender.mjs rewrites the title, description, canonical, social
         tags and JSON-LD for every route. These are the homepage values. -->
    <title>Junjie Wu Software Engineer</title>
    <meta name="description" content="Junjie Wu is a C++ software engineer and electrical engineer from UNSW Sydney who builds high-performance real-time software, GPU tooling and FPGA designs." />
    <meta name="author" content="Junjie Wu" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://www.junjiewu.com/" />
    <link rel="alternate" type="text/markdown" href="/llms.txt" title="llms.txt" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.junjiewu.com/" />
    <meta property="og:title" content="Junjie Wu Software Engineer" />
    <meta property="og:description" content="Junjie Wu is a C++ software engineer and electrical engineer from UNSW Sydney who builds high-performance real-time software, GPU tooling and FPGA designs." />
    <meta property="og:site_name" content="Junjie Wu" />
    <meta property="og:locale" content="en_AU" />
    <meta property="og:image" content="https://www.junjiewu.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Junjie Wu, Software Engineer" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Junjie Wu Software Engineer" />
    <meta name="twitter:description" content="Junjie Wu is a C++ software engineer and electrical engineer from UNSW Sydney who builds high-performance real-time software, GPU tooling and FPGA designs." />
    <meta name="twitter:image" content="https://www.junjiewu.com/og-image.png" />

    <script>
      // Homepage only: choose the 3D island or the simple view before first
      // paint (src/utils/homeView.ts reads the result from <html data-view>).
      (function () {
        if (location.pathname !== "/") return;
        var view = new URLSearchParams(location.search).get("view");
        var saved = null;
        try {
          if (view === "simple" || view === "island") localStorage.setItem("ui:view", view);
          saved = localStorage.getItem("ui:view");
        } catch (e) {
          saved = view;
        }
        var simple;
        if (saved === "simple" || saved === "island") {
          simple = saved === "simple";
        } else {
          var reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
          var webgl2 = false;
          try {
            var gl = document.createElement("canvas").getContext("webgl2");
            webgl2 = !!gl;
            var lose = gl && gl.getExtension("WEBGL_lose_context");
            if (lose) lose.loseContext();
          } catch (e) {}
          simple = reduced || !webgl2;
        }
        document.documentElement.dataset.view = simple ? "simple" : "island";
      })();
      // Day/night choice shared by the island and the simple view. Without a
      // saved choice, pages follow the system colour scheme.
      (function () {
        try {
          var mode = localStorage.getItem("ui:dayMode");
          if (mode === "day" || mode === "night") document.documentElement.dataset.theme = mode;
        } catch (e) {}
      })();
    </script>
    <style>
      /* On the island, the prerendered page stays in the HTML for crawlers and
         screen readers until the 3D app replaces it, without flashing on screen. */
      html[data-view="island"] #root > .doc-shell {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
